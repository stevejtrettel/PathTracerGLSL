<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexibleEngine Path Tracer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      min-width: 250px;
      font-size: 14px;
      z-index: 1000;
    }

    #ui h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      font-weight: 600;
      color: #4CAF50;
    }

    .ui-section {
      margin-bottom: 20px;
    }

    .ui-section:last-child {
      margin-bottom: 0;
    }

    .ui-label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    button:hover {
      background: #444;
      border-color: #666;
    }

    button.active {
      background: #4CAF50;
      border-color: #4CAF50;
    }

    button:active {
      transform: scale(0.98);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: #999;
    }

    .stat-value {
      color: #fff;
      font-weight: 600;
    }

    #error-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #d32f2f;
      color: #fff;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      display: none;
      z-index: 2000;
    }

    #error-display.show {
      display: block;
    }

    #error-display h2 {
      margin: 0 0 15px 0;
      font-size: 20px;
    }

    #error-display pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <h2>FlexibleEngine Path Tracer</h2>

    <div class="ui-section">
      <span class="ui-label">Renderer</span>
      <div class="button-group">
        <button id="btn-debug">Debug</button>
        <button id="btn-pathtracer" class="active">Pathtracer</button>
      </div>
      <div class="button-group" style="margin-top: 8px;">
        <button id="btn-pathtracer-aovs">PT+AOVs (MRT)</button>
      </div>
    </div>

    <div class="ui-section">
      <span class="ui-label">Stats</span>
      <div class="stat">
        <span class="stat-label">Samples</span>
        <span class="stat-value" id="stat-samples">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="stat-fps">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">GPU Main</span>
        <span class="stat-value"><span id="stat-gpu-main">-</span> ms</span>
      </div>
      <div class="stat">
        <span class="stat-label">GPU Display</span>
        <span class="stat-value"><span id="stat-gpu-display">-</span> ms</span>
      </div>
    </div>

    <div class="ui-section">
      <button id="btn-reset" style="width: 100%;">Reset Accumulation</button>
    </div>

    <div class="ui-section">
      <span class="ui-label">AOV Display (MRT Only)</span>
      <div class="button-group">
        <button id="btn-aov-radiance" class="active">Radiance</button>
        <button id="btn-aov-albedo">Albedo</button>
        <button id="btn-aov-normal">Normal</button>
      </div>
    </div>

    <div class="ui-section">
      <button id="btn-test-export" style="width: 100%;">Test Export Reading</button>
    </div>
  </div>

  <div id="error-display">
    <h2>Error</h2>
    <div id="error-message"></div>
    <pre id="error-stack"></pre>
  </div>

  <script type="module" src="examples/test-flexible-engine.ts"></script>
</body>
</html>
