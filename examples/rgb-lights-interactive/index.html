<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive RGB Lights - PathTracerGLSL</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    #glCanvas {
      border: 1px solid #333;
      max-width: 90vw;
      max-height: 90vh;
    }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="info">
    <strong>Interactive RGB Lights (Uniforms Mode)</strong><br>
    3 lights with runtime control<br>
    Open parameter panel to adjust colors, positions, intensities!
  </div>
  <canvas id="glCanvas" width="800" height="600"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
